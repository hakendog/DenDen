name: ci

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  scope:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      full: ${{ steps.scope.outputs.full }}
      scope: ${{ steps.scope.outputs.scope }}
      reason: ${{ steps.scope.outputs.reason }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - id: scope
        env:
          DENDEN_EVENT_NAME: ${{ github.event_name }}
          DENDEN_REPOSITORY: ${{ github.repository }}
          DENDEN_HEAD_REF: ${{ github.head_ref }}
          DENDEN_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          DENDEN_HEAD_SHA: ${{ github.sha }}
        run: node scripts/ci-scope.mjs

  cli-platforms:
    name: cli (${{ matrix.os }})
    needs: scope
    if: needs.scope.outputs.full == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test

  verify:
    needs: scope
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - if: needs.scope.outputs.full == 'true'
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          distribution: temurin
          java-version: 17
          cache: gradle
      - run: npm ci
      - if: needs.scope.outputs.full == 'true'
        run: npm test
      - if: needs.scope.outputs.full != 'true'
        run: node --test cli/test/ci-scope.test.mjs cli/test/distribution.test.mjs cli/test/public-repository.test.mjs
      - run: npm run verify:repository
      - if: github.repository == 'hakendog/DenDen'
        run: npm run verify:public
      - run: npm run verify:docs
      - run: git diff --check HEAD^ HEAD
      - if: needs.scope.outputs.full == 'true'
        run: |
          chmod +x gradlew
          ./gradlew test assembleDebug lint --no-daemon
      - if: needs.scope.outputs.full == 'true'
        run: npm run verify:apk

  android-instrumentation:
    name: android instrumentation (API ${{ matrix.api-level }})
    needs: scope
    if: needs.scope.outputs.full == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        api-level: [26, 35]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          distribution: temurin
          java-version: 17
          cache: gradle
      - name: Run Android instrumentation tests
        env:
          DENDEN_API_LEVEL: ${{ matrix.api-level }}
        run: |
          chmod +x gradlew
          export ANDROID_AVD_HOME="$RUNNER_TEMP/denden-avd"
          mkdir -p "$ANDROID_AVD_HOME"
          denden_system_image="system-images;android-${DENDEN_API_LEVEL};google_apis;x86_64"
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platform-tools" "emulator" "$denden_system_image"
          echo no | "$ANDROID_HOME/cmdline-tools/latest/bin/avdmanager" create avd --force --name denden-ci --package "$denden_system_image" --device pixel_2
          sudo chmod 666 /dev/kvm
          "$ANDROID_HOME/emulator/emulator" -avd denden-ci -no-window -no-audio -no-boot-anim -no-snapshot -gpu swiftshader_indirect &
          timeout 300 "$ANDROID_HOME/platform-tools/adb" wait-for-device
          denden_boot_deadline=$((SECONDS + 300))
          until [ "$("$ANDROID_HOME/platform-tools/adb" shell getprop sys.boot_completed | tr -d "\r")" = "1" ]; do
            if (( SECONDS >= denden_boot_deadline )); then exit 1; fi
            sleep 5
          done
          "$ANDROID_HOME/platform-tools/adb" shell input keyevent 82
          ./gradlew connectedDebugAndroidTest --no-daemon
