name: ci

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  scope:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      full: ${{ steps.scope.outputs.full }}
      scope: ${{ steps.scope.outputs.scope }}
      reason: ${{ steps.scope.outputs.reason }}
      android: ${{ steps.scope.outputs.android }}
      device: ${{ steps.scope.outputs.device }}
      cli: ${{ steps.scope.outputs.cli }}
      heavy: ${{ steps.scope.outputs.heavy }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - id: scope
        env:
          DENDEN_EVENT_NAME: ${{ github.event_name }}
          DENDEN_REPOSITORY: ${{ github.repository }}
          DENDEN_HEAD_REF: ${{ github.head_ref }}
          DENDEN_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          DENDEN_HEAD_SHA: ${{ github.sha }}
          DENDEN_PR_DRAFT: ${{ github.event.pull_request.draft || false }}
        run: node scripts/ci-scope.mjs

  verify:
    needs: scope
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - if: needs.scope.outputs.cli == 'true'
        run: npm test
      - if: needs.scope.outputs.cli != 'true'
        run: node --test cli/test/ci-scope.test.mjs cli/test/distribution.test.mjs cli/test/public-repository.test.mjs cli/test/verify-change.test.mjs
      - run: npm run verify:repository
      - if: github.repository == 'hakendog/DenDen'
        run: npm run verify:public
      - run: npm run verify:docs
      - name: Check changed diff
        env:
          DENDEN_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          DENDEN_HEAD_SHA: ${{ github.sha }}
        run: |
          if [ -n "$DENDEN_BASE_SHA" ] && ! [[ "$DENDEN_BASE_SHA" =~ ^0+$ ]]; then
            git diff --check "$DENDEN_BASE_SHA" "$DENDEN_HEAD_SHA"
          else
            git diff --check HEAD^ HEAD
          fi

  android-build:
    name: android compile, unit tests, and lint
    needs: [scope, verify]
    if: needs.scope.outputs.android == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          distribution: temurin
          java-version: 17
          cache: gradle
      - name: Run focused Android validation
        run: |
          chmod +x gradlew
          ./gradlew testDebugUnitTest assembleDebug assembleDebugAndroidTest lintDebug --build-cache --no-daemon
      - run: npm run verify:apk

  cli-platforms:
    name: cli (${{ matrix.os }})
    needs: [scope, verify]
    if: needs.scope.outputs.cli == 'true' && needs.scope.outputs.heavy == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test

  android-smoke:
    name: android focused device validation (API 26)
    needs: [scope, verify]
    if: needs.scope.outputs.device == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          distribution: temurin
          java-version: 17
          cache: gradle
      - name: Run API 26 instrumentation tests
        run: |
          chmod +x gradlew
          export ANDROID_AVD_HOME="$RUNNER_TEMP/denden-avd"
          mkdir -p "$ANDROID_AVD_HOME"
          denden_system_image="system-images;android-26;google_apis;x86_64"
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platform-tools" "emulator" "$denden_system_image"
          echo no | "$ANDROID_HOME/cmdline-tools/latest/bin/avdmanager" create avd --force --name denden-ci --package "$denden_system_image" --device pixel_2
          sudo chmod 666 /dev/kvm
          "$ANDROID_HOME/emulator/emulator" -avd denden-ci -no-window -no-audio -no-boot-anim -no-snapshot -gpu swiftshader_indirect &
          timeout 300 "$ANDROID_HOME/platform-tools/adb" wait-for-device
          denden_boot_deadline=$((SECONDS + 300))
          until [ "$("$ANDROID_HOME/platform-tools/adb" shell getprop sys.boot_completed | tr -d "\r")" = "1" ]; do
            if (( SECONDS >= denden_boot_deadline )); then exit 1; fi
            sleep 5
          done
          "$ANDROID_HOME/platform-tools/adb" shell input keyevent 82
          timeout 720 ./gradlew connectedDebugAndroidTest --build-cache --no-daemon

  android-compatibility:
    name: android full compatibility (API 35, shard ${{ matrix.shard-label }}/2)
    needs: [scope, verify]
    if: needs.scope.outputs.device == 'true' && needs.scope.outputs.heavy == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - shard-index: 0
            shard-label: 1
          - shard-index: 1
            shard-label: 2
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          distribution: temurin
          java-version: 17
          cache: gradle
      - name: Run sharded API 35 instrumentation tests
        env:
          DENDEN_SHARD_INDEX: ${{ matrix.shard-index }}
        run: |
          chmod +x gradlew
          export ANDROID_AVD_HOME="$RUNNER_TEMP/denden-avd"
          mkdir -p "$ANDROID_AVD_HOME"
          denden_system_image="system-images;android-35;google_apis;x86_64"
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platform-tools" "emulator" "$denden_system_image"
          echo no | "$ANDROID_HOME/cmdline-tools/latest/bin/avdmanager" create avd --force --name denden-ci --package "$denden_system_image" --device pixel_2
          sudo chmod 666 /dev/kvm
          "$ANDROID_HOME/emulator/emulator" -avd denden-ci -no-window -no-audio -no-boot-anim -no-snapshot -gpu swiftshader_indirect &
          timeout 300 "$ANDROID_HOME/platform-tools/adb" wait-for-device
          denden_boot_deadline=$((SECONDS + 300))
          until [ "$("$ANDROID_HOME/platform-tools/adb" shell getprop sys.boot_completed | tr -d "\r")" = "1" ]; do
            if (( SECONDS >= denden_boot_deadline )); then exit 1; fi
            sleep 5
          done
          "$ANDROID_HOME/platform-tools/adb" shell input keyevent 82
          timeout 900 ./gradlew connectedDebugAndroidTest --build-cache --no-daemon \
            -Pandroid.testInstrumentationRunnerArguments.numShards=2 \
            -Pandroid.testInstrumentationRunnerArguments.shardIndex="$DENDEN_SHARD_INDEX"
